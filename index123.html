<!DOCTYPE html>
<html>
<head>
    <title>Museum</title>

    <!-- Make the page fit phones too -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Connect CSS -->
    <link rel="stylesheet" href="style123.css">
</head>

<body>
     
    <a class="back-button" href="index.html" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 5l-7 7 7 7"></path>
        </svg>
    </a>
    
    <!-- The museum is drawn on this canvas by script.js -->
    <canvas id="museum"></canvas>

    <!-- This tall empty box gives the page something to scroll -->
    <!-- Scrolling down walks you through the museum -->
    <div class="scroll-space"></div>

    <!-- three.js (the 3D tool that script.js uses) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- JavaScript -->
    <script src="script1234.js"></script>

</body>
</html>
